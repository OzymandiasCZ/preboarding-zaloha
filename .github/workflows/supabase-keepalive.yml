name: Supabase keepalive

# Supabase Free plán uspává projekty po 7 dnech nízké aktivity.
# Workflow 1× denně zavolá SQL funkci public.keepalive() (viz migrace).
on:
  schedule:
    - cron: "17 6 * * *" # denně 06:17 UTC (mimo celou hodinu)
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Chybí secrety SUPABASE_URL / SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          for i in 1 2 3; do
            if curl -fsS --max-time 30 -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
                 -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
                 -H "Content-Type: application/json" -d '{}'; then
              echo; echo "OK"; exit 0
            fi
            echo "Pokus $i selhal, zkusím znovu…"; sleep $((i * 20))
          done
          echo "::error::Supabase neodpovídá – projekt může být pozastavený. Obnov ho v dashboardu (Restore project)."
          exit 1
